<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skyjo">
  <title>Skyjo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: #0b1220; color: #f1f5f9; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: contain; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }

    /* Carte. Il numero scala con la larghezza della carta (container query). */
    .card { container-type: inline-size; aspect-ratio: 4 / 5; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; border: 2px solid rgba(255,255,255,.28); box-shadow: 0 2px 0 rgba(0,0,0,.35); width: 100%; }
    .card > span { font-size: 46cqw; line-height: 1; }
    .card-back  { background: repeating-linear-gradient(45deg, #1e3a8a 0 7px, #1d4ed8 7px 14px); border-color: rgba(147,197,253,.4); }
    .card-empty { border: 2px dashed rgba(255,255,255,.12); box-shadow: none; background: transparent; }
    .tone-neg  { background: #4338ca; color: #fff; }
    .tone-zero { background: #7dd3fc; color: #0c4a6e; }
    .tone-low  { background: #4ade80; color: #052e16; }
    .tone-mid  { background: #fde047; color: #422006; }
    .tone-high { background: #f87171; color: #450a0a; }
    .is-target { outline: 3px solid #fbbf24; outline-offset: 1px; animation: pulse-target 1.4s ease-in-out infinite; }
    button.card:active { transform: scale(.95); }
    @keyframes pulse-target { 50% { outline-color: rgba(251,191,36,.3); } }
    @media (prefers-reduced-motion: reduce) { .is-target { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>Skyjo richiede JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
